
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarMaker ID Explorer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:15px}
.container{max-width:850px;margin:auto}
header{text-align:center;padding:25px 5px}
.logo{font-size:38px;color:#f5ca58}
h1{color:#f5ca58;margin:8px 0}
.sub{color:#aaa;font-size:13px}
.card{background:#171717;border:1px solid #624b20;border-radius:14px;padding:17px;margin:15px 0}
h2,h3{color:#f5ca58}
input{width:100%;padding:15px;background:#090909;border:1px solid #806329;border-radius:9px;color:#fff;font-size:16px;margin:10px 0}
button{padding:14px;border:0;border-radius:9px;background:linear-gradient(100deg,#d6a52f,#f6d77c);font-weight:bold;font-size:15px;width:100%;cursor:pointer}
button:disabled{opacity:.5}
#status{text-align:center;color:#f5ca58;padding:12px;font-size:14px}
.hidden{display:none}
.profile{text-align:center}
.avatar{width:110px;height:110px;border-radius:50%;border:3px solid #e9bd50;object-fit:cover;background:#222}
.name{font-size:22px;color:#f5d477;font-weight:bold;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{background:#242424;padding:12px;border-radius:9px;overflow-wrap:anywhere;min-width:0}
.field small{display:block;color:#aaa;margin-bottom:7px;font-size:12px}
.field strong{color:#f5d477;font-size:14px;overflow-wrap:anywhere}
.section-title{border-bottom:1px solid #55431f;padding-bottom:10px}
.data-image{max-width:100%;max-height:160px;object-fit:contain;border-radius:9px;margin-top:8px}
.nested{border:1px solid #40351e;border-radius:10px;padding:12px;margin:12px 0;background:#111}
.nested-title{color:#e9bd50;font-weight:bold;margin-bottom:12px;overflow-wrap:anywhere}
.empty{color:#aaa;text-align:center;padding:15px}
footer{text-align:center;color:#777;font-size:12px;padding:20px}
@media(max-width:450px){.grid{grid-template-columns:1fr 1fr}body{padding:9px}}
</style>
</head>
<body>
<div class="container">
<header>
 <div class="logo">⭐</div>
 <h1>StarMaker ID Explorer</h1>
 <div class="sub">Profile • VIP • Family • Recordings • Statistics</div>
</header>

<div class="card">
 <h3>🔎 StarMaker ID Search</h3>
 <input id="sid" inputmode="numeric" placeholder="Enter StarMaker SID">
 <button id="search" onclick="searchID()">SEARCH ID</button>
 <div id="status">Enter your StarMaker ID</div>
</div>

<div id="output" class="hidden">
 <div class="card profile">
  <img id="avatar" class="avatar" alt="Profile">
  <div id="name" class="name"></div>
  <div id="stage" class="sub"></div>
  <p id="signature"></p>
 </div>

 <div id="allSections"></div>
</div>

<footer>StarMaker ID Explorer • Data shown only when available in API response</footer>
</div>

<script>
const API_BASE =
"https://starmaker.id.vn/wp-json/sm-user/v1/lookup?sid=";
const PROXY = "https://proxy.cors.dev/";

const $ = id => document.getElementById(id);

function label(key){
 return String(key)
 .replace(/([A-Z])/g," $1")
 .replace(/_/g," ")
 .replace(/\b\w/g,c=>c.toUpperCase());
}

function isImage(value){
 return typeof value==="string" &&
 /^https?:\/\//i.test(value) &&
 /\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(value);
}

function makeField(key,value){
 const box=document.createElement("div");
 box.className="field";

 const small=document.createElement("small");
 small.textContent=label(key);
 box.appendChild(small);

 if(value===null || value===undefined || value===""){
  const strong=document.createElement("strong");
  strong.textContent="Not Available";
  box.appendChild(strong);
 }
 else if(typeof value==="boolean" || typeof value==="number" || typeof value==="string"){
  if(isImage(value)){
   const img=document.createElement("img");
   img.src=value;
   img.className="data-image";
   img.alt=label(key);
   box.appendChild(img);
  }else{
   const strong=document.createElement("strong");
   strong.textContent=String(value);
   box.appendChild(strong);
  }
 }
 else if(Array.isArray(value)){
  const strong=document.createElement("strong");
  strong.textContent=value.length ? value.map(x=>
   typeof x==="object"?JSON.stringify(x):String(x)
  ).join(", ") : "No Data";
  box.appendChild(strong);
 }
 else{
  const strong=document.createElement("strong");
  strong.textContent="[Details below]";
  box.appendChild(strong);
 }
 return box;
}

function renderObject(parent,key,obj){
 if(obj===null || obj===undefined) return;

 if(typeof obj!=="object"){
  parent.appendChild(makeField(key,obj));
  return;
 }

 const section=document.createElement("div");
 section.className="card";

 const title=document.createElement("h3");
 title.className="section-title";
 title.textContent="📌 "+label(key);
 section.appendChild(title);

 if(Array.isArray(obj)){
  if(obj.length===0){
   const empty=document.createElement("div");
   empty.className="empty";
   empty.textContent="No Data";
   section.appendChild(empty);
  }else{
   obj.forEach((item,index)=>{
    renderObject(section,"Item "+(index+1),item);
   });
  }
 }else{
  const grid=document.createElement("div");
  grid.className="grid";

  Object.entries(obj).forEach(([k,v])=>{
   if(v!==null && typeof v==="object"){
    if(Array.isArray(v) && v.length===0){
     grid.appendChild(makeField(k,"No Data"));
    }else{
     renderObject(section,k,v);
    }
   }else{
    grid.appendChild(makeField(k,v));
   }
  });

  if(grid.children.length) section.appendChild(grid);
 }

 parent.appendChild(section);
}

function renderProfile(data){
 const user=data.user || data.profile || {};
 const family=data.family || user.family || {};

 $("name").textContent=user.name || user.stage_name || "StarMaker User";
 $("stage").textContent=user.stage_name || "";
 $("signature").textContent=user.signature || "";

 const avatar=$("avatar");
 avatar.style.display=user.profile_image ? "inline-block":"none";
 avatar.src=user.profile_image || "";
 avatar.onerror=()=>avatar.style.display="none";

 const sections=$("allSections");
 sections.innerHTML="";

 Object.entries(data).forEach(([key,value])=>{
  if(value!==null && typeof value==="object"){
   renderObject(sections,key,value);
  }else{
   renderObject(sections,key,value);
  }
 });

 $("output").classList.remove("hidden");
}

async function request(url){
 let response;
 try{
  response=await fetch(url,{
   method:"GET",
   headers:{"Accept":"application/json"}
  });
  if(!response.ok) throw new Error("Direct request HTTP "+response.status);
  return await response.json();
 }catch(directError){
  response=await fetch(PROXY+url,{
   method:"GET",
   credentials:"omit",
   headers:{"Accept":"application/json, text/plain, */*"}
  });
  if(!response.ok) throw new Error("Proxy request HTTP "+response.status);
  return await response.json();
 }
}

async function searchID(){
 const sid=$("sid").value.trim();
 const status=$("status");
 const button=$("search");

 if(!/^\d{5,25}$/.test(sid)){
  status.textContent="Please enter a valid numeric StarMaker ID.";
  return;
 }

 button.disabled=true;
 button.textContent="SEARCHING...";
 status.textContent="Getting StarMaker profile information...";
 $("output").classList.add("hidden");

 try{
  const url=API_BASE+encodeURIComponent(sid)+"&lang=en";
  const result=await request(url);

  if(result.success===false){
   throw new Error(result.message || "User not found");
  }

  const data=result.data || result;

  if(!data.user && !data.profile && !data.family){
   throw new Error("No profile data returned for this ID.");
  }

  renderProfile(data);
  status.textContent="✓ Information loaded successfully.";

 }catch(error){
  status.textContent="Error: "+error.message;
 }finally{
  button.disabled=false;
  button.textContent="SEARCH ID";
 }
}

$("sid").addEventListener("keydown",e=>{
 if(e.key==="Enter") searchID();
});
</script>
</body>
</html>
